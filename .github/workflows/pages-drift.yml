name: pages-drift
# Regenerates pages.json from the GitHub API and fails when the committed file differs (drift).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Regenerate pages.json from the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gen-pages.mjs
      - name: Fail on drift
        run: |
          if ! git diff --exit-code pages.json; then
            echo "::error::pages.json drifted from the GitHub API. Run node scripts/gen-pages.mjs and commit."
            exit 1
          fi
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Submodule set equals the declared html-repo list
        run: node scripts/gen-gitmodules.mjs --check
  repos-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the git-repos-master submodule (SoT kinds.json)
        run: git submodule update --init --depth 1 git-repos-master
      - name: repos-pages.json equals a fresh render (drift guard)
        run: node scripts/gen-repos-pages.mjs --check
      - name: Every SoT html repo is on every surface (with mutations)
        run: node tests/test-repos-pages.mjs
